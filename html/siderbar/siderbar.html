<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu | RedatorPro</title>
    <!-- Link Google Fonts para icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="siderbar.css">
</head>
<body>
    <aside class="sidebar">
        <!-- Siderbar Header -->
        <header class="sidebar-header">
            <img src="../../www/img/default.png" alt="imagem-logo" class="header-logo" >
            <button class="sidebar-toggle">
                <span class="material-symbols-outlined">
                    chevron_left
                </span>
            </button>
        </header>

        <div class="sidebar-content">
            <!-- Busca -->
            <from action="#" class="search-form">
                <span class="material-symbols-outlined">
                    search
                </span>
                <input type="search" placeholder="Search..." required ></input>
            </from>

            <!-- Menu List-->
            <ul class="menu-list">
                <li class="menu-item">
                    <a href="#" class="menu-link active">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="menu-label">Dashboard</span>
                    </a>
                </li>

                <li class="menu-item">
                    <a href="#" class="menu-link">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="menu-label">Dashboard</span>
                    </a>
                </li>

                <li class="menu-item">
                    <a href="#" class="menu-link">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="menu-label">Dashboard</span>
                    </a>
                </li>

                <li class="menu-item">
                    <a href="#" class="menu-link">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="menu-label">Dashboard</span>
                    </a>
                </li>

                <li class="menu-item">
                    <a href="#" class="menu-link">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="menu-label">Dashboard</span>
                    </a>
                </li>

                <li class="menu-item">
                    <a href="#" class="menu-link">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="menu-label">Dashboard</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <button class="theme-toggle">
                <div class="theme-label">
                    <span class="material-symbols-outlined theme-icon">dark_mode</span>
                    <span class="theme-text">Dark Mode</span>
                </div>
                <div class="theme-toggle-track">
                    <div class="theme-toggle-indicator"></div>
                </div>
            </button>
        </div>
    </aside>

    <script src="siderbar.js"></script>
</body>
</html>
