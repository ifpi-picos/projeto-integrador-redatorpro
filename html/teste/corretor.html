<div data-name="iacorretor" class="page">
    <div class="buttons-top">
        <a href="/index/" class="back-button"><i class="ri-arrow-left-s-line"></i></a>
    </div>
    
    <div class="correction-header">
        <div class="header-icon">
            <i class="ri-ai-generate"></i>
        </div>
        <h1>Correção por IA</h1>
        <p class="header-subtitle">Receba feedback detalhado da sua redação</p>
    </div>

    <div class="correction-container">
        <form id="formCorrecao" enctype="multipart/form-data">
            <div class="form-card">
                <div class="form-section">
                    <label for="tipoCorrecao" class="form-label">
                        <i class="ri-graduation-cap-line"></i> Tipo de Correção
                    </label>
                    <select id="tipoCorrecao" name="tipoCorrecao" class="form-select" required>
                        <option value="">Selecione o modelo</option>
                        <option value="enem">ENEM</option>
                        <option value="concursos">FCC</option>
                        <option value="fuvest">Fuvest</option>
                    </select>
                </div>

                <div class="form-section">
                    <label for="temaRedacao" class="form-label">
                        <i class="ri-edit-2-line"></i> Tema da Redação
                    </label>
                    <select id="temaRedacao" name="temaRedacao" class="form-select" required onchange="toggleTemaLivre()">
                        <option value="">Selecione um tema</option>
                        <option value="tema1">A violência doméstica e o combate ao feminicídio</option>
                        <option value="tema2">O papel da IA na transformação da educação: limites e possibilidades</option>
                        <option value="livre">Tema Livre</option>
                    </select>
                    <input type="text" id="temaLivre" name="temaLivre" class="form-input" placeholder="Digite o tema aqui..." style="display:none;">
                </div>

                <div class="form-section">
                    <label for="imagemUpload" class="form-label">
                        <i class="ri-camera-line"></i> Envie sua redação
                    </label>
                    <div class="file-upload-wrapper">
                        <label for="imagemUpload" class="file-upload-label">
                            <i class="ri-upload-cloud-line"></i>
                            <span>Selecione uma imagem</span>
                        </label>
                        <input type="file" id="imagemUpload" name="imagem" accept="image/*" class="file-upload-input">
                    </div>
                    <div class="upload-hint">
                        <i class="ri-information-line"></i> Para melhor experiência, envie uma imagem com boa qualidade e letra legível!
                    </div>
                </div>
            </div>

            <div class="mobile-actions">
                <button type="button" id="btnDigitarRedacao" class="action-button">
                    <i class="ri-keyboard-line"></i> Digitar Redação
                </button>
            </div>

            <div class="writing-area" style="display:none;">
                <div class="line-numbers">
                    <pre>1

                </div>
                <textarea class="area" id="textoRedacao" name="textoRedacao" rows="30" cols="85" placeholder="Escreva sua redação aqui..."></textarea>
            </div>

            <button type="submit" class="submit-button">
                <i class="ri-send-plane-line"></i> Enviar para correção
            </button>
        </form>
    </div>

    <div id="folhaAmpliadaOverlay" class="folha-ampliada-overlay">

            <button type="button" id="btnFecharFolha" class="btn-fechar-folha">&times;</button>
