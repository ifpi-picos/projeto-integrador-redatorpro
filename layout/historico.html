<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Histórico de Correções</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/historico.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="themes/colors/colors.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>Histórico de Correções</h1>
          <p>Veja todas as redações que você corrigiu</p>
        </div>
        <div class="stats">
          <p>
            <strong>Total corrigido:</strong>
            <span id="totalCorrigido">0 redações</span>
          </p>
        </div>
      </header>

      <div class="search-filter">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Buscar por aluno ou tema..." />
        </div>
        <div class="filter-dropdown">
          <select>
            <option value="">Todos os modelos</option>
            <option value="enem">ENEM</option>
            <option value="esa">ESA</option>
            <option value="fuvest">FUVEST</option>
            <option value="unicamp">UNICAMP</option>
          </select>
        </div>
        <div class="filter-dropdown">
          <select>
            <option value="">Todas as edições</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
          </select>
        </div>
      </div>

      <div id="history-state" class="history-state text-muted" role="status">
        Carregando histórico...
      </div>

      <div class="corrections-grid"></div>

      <div class="pagination"></div>

      <!-- Navbar responsiva-->
      <nav class="app-navbar">
        <div class="navbar-container">
          <a href="area-trabalho.html" class="nav-btn" id="workspaceBtn">
            <div class="nav-icon">
              <i class="fas fa-briefcase"></i>
            </div>
            <span class="nav-label">Trabalho</span>
          </a>

          <a href="themes/themes.html" class="nav-btn" id="themeToggleBtn">
            <div class="nav-icon">
              <i class="fas fa-moon" id="themeIcon"></i>
            </div>
            <span class="nav-label">Tema</span>
          </a>

          <a href="index.html" class="nav-btn" id="profileBtn">
            <div class="nav-icon">
              <i class="fas fa-user"></i>
            </div>
            <span class="nav-label">Perfil</span>
          </a>
        </div>
      </nav>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="themes/themes.js"></script>
    <script src="js/main.js"></script>
    <script src="js/historico.js"></script>

    <!-- Adicione este HTML antes do fechamento </body> -->
    <div id="filters-feedback" style="display: none">
      <div class="no-results">
        <div class="no-results-image">
          <i class="fas fa-search fa-3x"></i>
        </div>
        <h3>Nenhuma redação encontrada</h3>
        <p>Não encontramos resultados com os filtros atuais.</p>
        <button id="reset-filters" class="btn btn-primary">
          Limpar todos os filtros
        </button>
      </div>
    </div>
  </body>
</html>
