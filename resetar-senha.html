<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir Senha</title>
    <style>
      /* estilos locais para esta página */
      .auth-page { display:flex; align-items:center; justify-content:center; min-height:100vh; background: linear-gradient(180deg,#50E4E4 0%, #9de1e1 60%); padding:2rem; }
      .auth-card{ width:100%; max-width:480px; background:#fff; border-radius:14px; padding:28px; box-shadow: 0 12px 40px rgba(15,30,40,0.12); }
      .auth-card .logo img{ width:170px; display:block; margin:0 auto 12px; }
      .auth-card h2{ text-align:center; color:#203646; margin-bottom:6px; }
      .auth-card p.lead{ text-align:center; color:#6b6b6b; margin-bottom:18px; font-size:0.95rem; }
      .auth-card .field { margin-bottom:14px; }
      .auth-card label{ display:block; font-size:0.9rem; color:#4f4f4f; margin-bottom:6px; }
      .auth-card input.input-field{ width:100%; padding:12px 14px; border:1px solid #d7e6ea; border-radius:8px; background:transparent; color:#203646; font-size:0.95rem; }
      .auth-card .sign-btn{ width:100%; padding:12px; border-radius:10px; background:#246493; color:#fff; border:none; font-weight:600; cursor:pointer; }
      .auth-card .sign-btn[disabled]{ opacity:0.6; cursor:not-allowed; }
      #statusMsg{ text-align:center; margin-top:12px; min-height:24px; font-size:0.95rem; }
      .pwd-strength{ font-size:0.85rem; color:#6b6b6b; margin-top:4px; }
      @media (max-width:480px){ .auth-card{ padding:18px; } .auth-card .logo img{ width:150px; } }
    </style>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="reset-title">
        <div class="logo">
          <img src="imagens/logo nome.png" alt="RedatorPRO" />
        </div>

        <h2 id="reset-title">Redefinir Senha</h2>
        <p class="lead">Escolha uma nova senha. O link expira em breve.</p>

        <form id="resetarSenhaForm" novalidate>
          <div class="field">
            <label for="novaSenha">Nova senha</label>
            <input id="novaSenha" class="input-field" type="password" minlength="4" autocomplete="new-password" required placeholder="Mínimo 4 caracteres" />
            <div id="pwdInfo" class="pwd-strength"></div>
          </div>

          <div class="field">
            <label for="confirmarSenha">Confirmar nova senha</label>
            <input id="confirmarSenha" class="input-field" type="password" minlength="4" autocomplete="new-password" required placeholder="Repita a nova senha" />
          </div>

          <button id="btnRedefinir" class="sign-btn" type="submit" disabled>Redefinir senha</button>

          <div id="statusMsg" aria-live="polite"></div>

          <div style="margin-top:12px; display:flex; justify-content:center;">
            <a href="login.html" style="color:#246493; font-weight:600; text-decoration:none;">Voltar ao login</a>
          </div>
        </form>
      </section>
    </main>

    <script>
      (function(){
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const form = document.getElementById('resetarSenhaForm');
        const nova = document.getElementById('novaSenha');
        const conf = document.getElementById('confirmarSenha');
        const btn = document.getElementById('btnRedefinir');
        const status = document.getElementById('statusMsg');
        const pwdInfo = document.getElementById('pwdInfo');

        if (!token) {
          status.innerHTML = '<span style="color:#c33;">Token de redefinição não encontrado na URL.</span>';
          btn.disabled = true;
          nova.disabled = true;
          conf.disabled = true;
          return;
        }

        function atualizarEstado() {
          const s = nova.value || '';
          let ok = s.length >= 4 && s === conf.value && conf.value.length>0;
          btn.disabled = !ok;
          // info simples de força
          if (s.length === 0) { pwdInfo.textContent = ''; }
          else if (s.length < 6) { pwdInfo.textContent = 'Senha fraca'; pwdInfo.style.color = '#c66'; }
          else { pwdInfo.textContent = 'Senha OK'; pwdInfo.style.color = '#2a9d8f'; }
        }

        nova.addEventListener('input', atualizarEstado);
        conf.addEventListener('input', atualizarEstado);

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (nova.value.length < 4) {
            status.innerHTML = '<span style="color:#c33;">A senha deve ter ao menos 4 caracteres.</span>';
            return;
          }
          if (nova.value !== conf.value) {
            status.innerHTML = '<span style="color:#c33;">As senhas não coincidem.</span>';
            return;
          }
          btn.disabled = true;
          status.innerHTML = 'Enviando...';
          try {
            const resp = await fetch('/users/resetar-senha', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, novaSenha: nova.value })
            });
            const data = await resp.json();
            if (resp.ok) {
              status.innerHTML = '<span style="color:green;">' + (data.message || 'Senha redefinida com sucesso. Faça login com a nova senha.') + '</span>';
              form.reset();
              btn.disabled = true;
              pwdInfo.textContent = '';
            } else {
              status.innerHTML = '<span style="color:#c33;">' + (data.error || 'Erro ao redefinir senha.') + '</span>';
              btn.disabled = false;
            }
          } catch (err) {
            console.error(err);
            status.innerHTML = '<span style="color:#c33;">Erro ao conectar ao servidor.</span>';
            btn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
