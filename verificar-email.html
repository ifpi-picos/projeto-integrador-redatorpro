<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificação de E-mail</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <main>
      <div class="box">
        <div class="inner-box">
          <div class="forms-wrap" style="width:100%;display:flex;align-items:center;justify-content:center;">
            <form class="sign-in-form" style="max-width:320px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;">
              <div class="logo" style="margin-bottom:1.5rem;">
                <img src="imagens/logo nome.png" alt="RedatorPRO" />
              </div>
              <div class="heading" style="text-align:center;">
                <h2 style="margin-bottom:1rem;">Verificação de E-mail</h2>
              </div>
              <div class="actual-form" style="text-align:center;">
                <div id="statusMsg">
                  <p class="text" style="margin-bottom:1.5rem;">
                    Verificando seu e-mail, aguarde...
                  </p>
                </div>
                <a href="login.html" class="sign-btn" style="margin-top:2rem;">Voltar para o Login</a>
              </div>
            </form>
          </div>
          <div class="carousel" style="display:none;"></div>
        </div>
      </div>
    </main>
    <script>
      // Script para processar o token da URL e chamar o backend
      (async function() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const statusMsg = document.getElementById('statusMsg');
        if (!token) {
          statusMsg.innerHTML = `<p class="text" style="color:red;">Token de verificação não encontrado na URL.</p>`;
          return;
        }
        try {
          const response = await fetch(`https://express-e3hm.onrender.com/users/verificar-email?token=${token}`);
          if (response.redirected) {
            // Se o backend redirecionar, considere como sucesso
            statusMsg.innerHTML = `<p class="text" style="color:green;">Seu e-mail foi verificado com sucesso!<br>Agora você pode fazer login normalmente.</p>`;
            return;
          }
          const data = await response.json();
          if (response.ok) {
            statusMsg.innerHTML = `<p class="text" style="color:green;">Seu e-mail foi verificado com sucesso!<br>Agora você pode fazer login normalmente.</p>`;
          } else {
            statusMsg.innerHTML = `<p class="text" style="color:red;">${data.error || "Erro ao verificar e-mail."}</p>`;
          }
        } catch (err) {
          statusMsg.innerHTML = `<p class="text" style="color:red;">Erro ao conectar ao servidor de verificação.</p>`;
        }
      })();
    </script>
  </body>
</html>
