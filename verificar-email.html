<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificação de E-mail</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <main>
      <div class="box">
        <div class="inner-box">
          <div class="forms-wrap" style="width:100%;display:flex;align-items:center;justify-content:center;">
            <form class="sign-in-form" style="max-width:320px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;">
              <div class="logo" style="margin-bottom:1.5rem;">
                <img src="imagens/logo nome.png" alt="RedatorPRO" />
              </div>
              <div class="heading" style="text-align:center;">
                <h2 style="margin-bottom:1rem;">Verifique seu E-mail</h2>
              </div>
              <div class="actual-form" style="text-align:center;">
                <p class="text" style="margin-bottom:1.5rem;">
                  Enviamos um link de verificação para o seu e-mail.<br>
                  Por favor, acesse sua caixa de entrada e clique no link para ativar sua conta.
                </p>
                <p class="text" style="color:#b4820d;">
                  Não encontrou o e-mail? Verifique também a caixa de spam ou lixo eletrônico.
                </p>
                <a href="login.html" class="sign-btn" style="margin-top:2rem;">Voltar para o Login</a>
              </div>
            </form>
          </div>
          <div class="carousel" style="display:none;"></div>
        </div>
      </div>
    </main>
    <script>
      // Script para processar o token da URL e chamar o backend
      (async function() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (!token) {
          alert('Token de verificação não encontrado na URL.');
          return;
        }
        try {
          // Troque a URL abaixo para o endpoint correto do seu backend
          const response = await fetch(`https://express-e3hm.onrender.com/users/verificar-email?token=${token}`);
          if (response.redirected) {
            // Se o backend redirecionar, siga o redirecionamento
            window.location.href = response.url;
            return;
          }
          const data = await response.json();
          if (response.ok) {
            // Sucesso: redirecione ou mostre mensagem
            window.location.href = "verificacao-sucesso.html";
          } else {
            alert(data.error || "Erro ao verificar e-mail.");
          }
        } catch (err) {
          alert("Erro ao conectar ao servidor de verificação.");
        }
      })();
    </script>
  </body>
</html>
