<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/folha.css" />
<title>Folha de Redação</title>
</head>
<body>
    <header>
        <h1>Folha de Redação</h1>
    </header>
    <div class="container">
        <div class="line-numbers">
            <pre>1
2

</pre>
        </div>
        <textarea class="area" rows="31" placeholder="Escreva sua redação aqui..." oninput="limitLines(this, 31)"></textarea>
    </div>
    <script>
        function limitLines(textarea, maxLines) {
            const lines = textarea.value.split('\n');
            if (lines.length > maxLines) {
                textarea.value = lines.slice(0, maxLines).join('\n');
            }
        }
    </script>
</body>
</html>
