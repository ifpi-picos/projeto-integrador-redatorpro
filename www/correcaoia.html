<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correção por IA</title>
    <link rel="stylesheet" href="correcaoia.css">
</head>
<body>
    <div class="container">
        <h1>Correção por IA</h1>

        <textarea id="textoRedacao" rows="30" placeholder="Digite sua redação aqui..."></textarea>
        <div class="botoes">
            <button class="btn-corrigir" onclick="corrigirTexto()">Corrigir Redação</button>
            <button class="btn-nova-redacao" onclick="novaRedacao()">Nova Redação</button>
        </div>
        

        <div id="resultado" class="comentarios" style="display:none;">
            <h2>Resultado da Correção</h2>
            <p><strong>Nota:</strong> <span id="nota"></span></p>

            <p><strong>Comentários:</strong></p>
            <p><strong>Pontos Positivos:</strong></p>
            <p><strong>Clareza e Coerência:</strong> <span id="coerencia"></span></p>
            <p><strong>Argumentação:</strong> <span id="argumentacao"></span></p>
            <p><strong>Estrutura:</strong> <span id="estrutura"></span></p>
            <p><strong>Vocabulário:</strong> <span id="vocabulario"></span></p>
            <p><strong>Conclusão:</strong> <span id="conclusao"></span></p>
        </div>

    </div>

    <script>
        function corrigirTexto() {
            const texto = document.getElementById("textoRedacao").value.trim();
            if (texto === "") {
                alert("Digite uma redação para corrigir.");
                return;
            }
        // Simulação da IA
        document.getElementById("nota").textContent = "950";
        document.getElementById("coerencia").textContent = "O texto apresenta boa clareza e coesão com vocabulário formal.";
        document.getElementById("argumentacao").textContent = "Apresenta exemplos concretos e diferentes perspectivas.";
        document.getElementById("estrutura").textContent = "Estrutura organizada, com parágrafos bem delimitados.";
        document.getElementById("vocabulario").textContent = "Formal, com palavras bem escolhidas como 'implementação', 'configuração', 'imprescindíveis'.";
        document.getElementById("conclusao").textContent = "Reitera a tese e propõe solução eficaz sem apresentar informações novas.";

        document.getElementById("resultado").style.display = "block";
}

        function novaRedacao() {
        document.getElementById("textoRedacao").value = "";
        document.getElementById("resultado").style.display = "none";
}
</script>
</body>
</html>
