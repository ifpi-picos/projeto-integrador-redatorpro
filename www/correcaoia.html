<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatRedator</title>
  <link rel="stylesheet" href="correcaoia.css">
</head>
<body>
  <header>
    <h1>Bem-vindo(a) ao ChatRedator!</h1>
  </header>

  <main id="chat-container">
    <div class="message user">
      <div class="avatar user-avatar"></div>
      <div class="bubble">
        <strong>Sarah</strong><br>
        Oi, boa tarde!
      </div>
    </div>
    <div class="message bot">
      <div class="avatar bot-avatar"></div>
      <div class="bubble">
        <strong>ChatRedator</strong><br>
        Boa tarde! Como vai o aprendizado?
      </div>
    </div>
    <div class="message bot">
      <div class="avatar bot-avatar"></div>
      <div class="bubble">
        Como posso ajudar na sua redação?
      </div>
    </div>
  </main>

  <footer>
    <textarea id="input" placeholder="Digite sua mensagem, jovem..."></textarea>
    <button onclick="enviarMensagem()">Enviar</button>
  </footer>

  <script>
    function enviarMensagem() {
      const input = document.getElementById("input");
      const texto = input.value.trim();
      if (!texto) return;

      const chat = document.getElementById("chat-container");

      // Mensagem do usuário
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.innerHTML = `
        <div class="bubble">${texto}</div>
        <div class="avatar user-avatar"></div>
      `;
      chat.appendChild(userMessage);

      input.value = "";

      // Simula resposta do bot
      setTimeout(() => {
        const resposta = gerarRespostaSimulada(texto);
        const botMessage = document.createElement("div");
        botMessage.className = "message bot";
        botMessage.innerHTML = `
          <div class="avatar bot-avatar"></div>
          <div class="bubble">
            <strong>ChatRedator</strong><br>${resposta}
          </div>
        `;
        chat.appendChild(botMessage);
        chat.scrollTop = chat.scrollHeight;
      }, 1000);
    }

    function gerarRespostaSimulada(redacao) {
      return "Sua redação foi avaliada. Nota: 880; Competencias: C1: 160; C2: 200; C3: 200; C4: 120; C5: 200.";
    }
  </script>
</body>
</html>
