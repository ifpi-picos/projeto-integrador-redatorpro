<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatRedator</title>
  <link rel="stylesheet" href="css/correcaoia.css">
</head>
<body>
  <header>
    <h1>Bem-vindo(a) ao ChatRedator!</h1>
  </header>

  <main id="chat-container">
    <!-- Mensagens serão inseridas via JS -->
  </main>

  <footer>
    <button id="btnNovaRedacao">Escrever nova redação</button>
  </footer>

  <script src="js/correcaoia.js"></script>
  <script>
    document.getElementById('btnNovaRedacao').onclick = function() {
      if (window.app && app.views && app.views.main && app.views.main.router) {
        app.views.main.router.navigate('/iacorretor/');
      } else {
        window.location.href = 'iacorretor.html';
      }
    };
  </script>
</body>
</html>
