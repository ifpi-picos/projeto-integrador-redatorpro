<div data-name="corrigidas" class="page">
  <div class="buttons-top">
    <a href="/pendentes/" class="back-button"><i class="ri-arrow-left-s-line"></i></a>
  </div>

  <div class="page-content">
    <div class="corrigidas-page">
      <main class="corr-layout">
        <section class="card essay-card">
          <div class="essay-meta">
            <h2 id="temaTxt">Correção</h2>
            <p id="infoTxt" class="muted">—</p>
          </div>
          <div id="essayView" class="essay-view">
            <!-- Texto ou Imagem+Canvas -->
          </div>
        </section>

        <aside class="card side-card">
          <div class="nota-e-corretor">
            <div class="nota-total">
              <span class="label">Nota Total</span>
              <span class="valor" id="notaTotalTxt">—</span>
            </div>
            <div class="corretor-info" id="corretorInfo" title="Corretor">
              <img id="corretorAvatar" alt="Corretor">
              <span id="corretorNome">—</span>
            </div>
          </div>

          <h3>Notas por competência</h3>
          <div class="competencias" id="competenciasBox"></div>

          <h3>Comentários gerais</h3>
          <div class="comentarios" id="comentariosBox">—</div>

          <h3>Marcações e observações</h3>
          <div id="obsList" class="obs-list"></div>
        </aside>
      </main>

      <!-- Estados -->
      <div id="loading" class="state">Carregando correção...</div>
      <div id="empty" class="state" style="display:none;">Correção ainda não disponível.</div>
      <div id="error" class="state" style="display:none;">Erro ao carregar correção.</div>
    </div>
  </div>
</div>

<!-- Fallbacks (não afetam outras telas) -->
<script src="lib/framework7-bundle.min.js"></script>
<script src="lib/jquery-3.7.0.min.js"></script>
<script src="js/routes.js"></script>
<script src="cordova.js"></script>
<script src="js/corrigidas.js"></script>
        </aside>
      </main>

      <!-- Estados -->
      <div id="loading" class="state">Carregando correção...</div>
      <div id="empty" class="state" style="display:none;">Correção ainda não disponível.</div>
      <div id="error" class="state" style="display:none;">Erro ao carregar correção.</div>
    </div>
  </div>
</div>
