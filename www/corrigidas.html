<div data-name="corrigidas" class="page">
  <div class="page-content no-padding">
    <div class="corrigidas-header">
      <div class="corrigidas-header-main">
        <i class="ri-check-double-line"></i>
        <div>
          <h1>Correção</h1>
          <p class="header-subtitle">Veja o feedback detalhado da sua redação</p>
        </div>
      </div>
      <div class="corrigidas-header-nota">
        <span class="nota-label">Nota Total</span>
        <span class="nota-valor" id="notaTotalTxt">—</span>
      </div>
    </div>
    <div class="corrigidas-stack-container">
      <div class="corrigidas-block corrigidas-corretor">
        <img id="corretorAvatar" alt="Corretor">
        <span id="corretorNome">—</span>
      </div>
      <div class="corrigidas-block corrigidas-redacao-card">
        <div class="corrigidas-redacao-info">
          <span id="temaTxt" class="corrigidas-tema">—</span>
          <span id="infoTxt" class="corrigidas-info">—</span>
        </div>
        <!-- Ajuste: wrapper para rolagem vertical -->
        <div class="corrigidas-essay-area-wrapper scroll-x">
          <div class="corrigidas-essay-area" id="essayView" style="position:relative;overflow-y:auto;height:400px;max-height:400px;">
            <!-- A imagem e o canvas serão inseridos via JS, um sobre o outro, ambos com position: static -->
          </div>
        </div>
      </div>
      <div class="corrigidas-block corrigidas-card">
        <h3>Notas e Competências</h3>
        <div id="competenciaNavegacao" style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
          <button id="btnCompAnterior" class="btn-comp-nav" type="button" disabled>&lt; Anterior</button>
          <span id="compAtualLabel" style="flex:1;text-align:center;"></span>
          <button id="btnCompProximo" class="btn-comp-nav" type="button">&gt; Próximo</button>
        </div>
        <div id="competenciaUnica"></div>
      </div>
      <div class="corrigidas-block corrigidas-card">
        <h3>Comentário Geral</h3>
        <div id="comentariosBox">—</div>
      </div>
      <div class="corrigidas-block corrigidas-card">
        <h3>Marcações e Anotações</h3>
        <div id="obsList"></div>
      </div>
      <div id="loading" class="state">Carregando correção...</div>
      <div id="empty" class="state" style="display:none;">Correção ainda não disponível.</div>
      <div id="error" class="state" style="display:none;">Erro ao carregar correção.</div>
    </div>
  </div>
</div>
<script src="lib/framework7-bundle.min.js"></script>
<script src="lib/jquery-3.7.0.min.js"></script>
<script src="js/routes.js"></script>
<script src="cordova.js"></script>
<script src="js/corrigidas.js"></script>

</div>
