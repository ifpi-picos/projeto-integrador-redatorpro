<div data-name="iacorretor" class="page">
    <div class="buttons-top">
        <a href="/index/"><i class="ri-arrow-left-s-line"></i></a>
    </div>
    <header>
        <h1>Correção por IA</h1>
    </header>
    <div class="container">
        <form id="formCorrecao" enctype="multipart/form-data">
            <div class="options">
                <label for="tipoCorrecao">Tipo de Correção:</label>
                <select id="tipoCorrecao" name="tipoCorrecao" required>
                    <option value="">Selecione</option>
                    <option value="enem">ENEM</option>
                    <option value="concursos">FCC</option>
                    <option value="fuvest">Fuvest</option>
                </select>
                <label for="temaRedacao" style="margin-top:16px;">Tema da Redação:</label>
                <select id="temaRedacao" name="temaRedacao" required onchange="toggleTemaLivre()">
                    <option value="">Selecione</option>
                    <option value="tema1">A violência doméstica e o combate ao feminicídio</option>
                    <option value="tema2">O papel da IA na transformação da educação: limites e possibilidades</option>
                    <option value="livre">Tema Livre</option>
                </select>
                <input type="text" id="temaLivre" name="temaLivre" placeholder="Digite o tema" style="display:none; margin-top:8px;">
                <label for="imagemUpload" style="margin-top:16px;">Envie uma foto da redação:</label>
                <input type="file" id="imagemUpload" name="imagem" accept="image/*" style="margin-bottom:12px;">
                <div style="color:#b00; font-size:1rem; margin-bottom:8px;">
                    Envie <b>apenas o texto digitado</b> <u>ou</u> <b>apenas a imagem</b> da redação. Não envie ambos!
                </div>
            </div>
            <div class="mobile-actions">
                <button type="button" id="btnDigitarRedacao" class="submit-button">Digitar Redação</button>
            </div>
            <!-- writing-area agora sempre escondida por padrão -->
            <div class="writing-area" style="display:none;">
                <div class="line-numbers">
                    <pre>1

                </div>
                <textarea class="area" id="textoRedacao" name="textoRedacao" rows="30" cols="85" placeholder="Escreva sua redação aqui..."></textarea>
            </div>
            <button type="submit" class="submit-button">Enviar para o ChatRedator!</button>
        </form>
    </div>
    <!-- Folha ampliada para digitação no mobile -->
