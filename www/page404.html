<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>Página não encontrada</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <link rel="stylesheet" href="css/page404.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="page404" class="page">
                <div class="page-content page404-content">
                    <div class="error-code">404</div>
                    <i class="mdi mdi-alert-circle-outline error-icon"></i>
                    <h1 class="error-title">Página não encontrada</h1>
                    <p class="error-text">O conteúdo que você procura pode ter sido movido, esteja em desenvolvimento ou não exista mais.</p>
                    <a href="/index/" class="button button-fill button-round color-blue back-home">
                        <span class="mdi material-symbols-outlined">home_app_logo</span>Voltar à página inicial
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="lib/framework7-bundle.min.js"></script>
    <script src="lib/jquery-3.7.0.min.js"></script>	
    <script src="js/routes.js"></script>
    <script src="cordova.js"></script>
</body>

</html>
