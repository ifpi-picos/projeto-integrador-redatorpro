<!DOCTYPE html>
<html>

<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Your app title -->
    <title>My App</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- CSS PERSONALIZADO PARA MENU-->
    <link rel="stylesheet" href="css/functions.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <title>Tela de Perfil</title>
    <style>
        .boddy {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .profile-container {
            width: 500px;
            background-color: #f7f7f7;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .profile-header {
            display: flex;
            align-items: center;
            position: relative;
            border-bottom: 1px solid #9a9a9a;
            padding-bottom: 10px;
        }

        .profile-picture {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #d9d9d9;
        }

        .profile-info {
            margin-left: 20px;
        }

        .profile-info h2 {
            margin: 0;
            font-size: 20px;
        }

        .profile-info p {
            margin: 5px 0 0;
            color: #999;
            font-size: 12px;
        }

        .status-button {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #3b3b3b;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .status-button:hover {
            background-color: #555;
        }

        .content {
            margin-top: 20px;
        }

        .function {
            margin-bottom: 35px;
        }

        .informations {
            margin-bottom: 25px;
        }

        .connections {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .connection {
            background-color: #7872ef;
            border-radius: 8px;
            padding: 10px;
            flex: 1;
            text-align: center;
            margin: 0 5px;
            transition: background 0.3s;
            color: #fff;
        }

        .connection:hover {
            background-color: #4f46e5;
        }

        .connection span {
            display: block;
            margin-top: 5px;
            color: #d6d6d6;
            font-size: 12px;
        }
        .content .membro {
            line-height: 1px;
        }

        .note {
            margin-bottom: 30px;
        }

        .note p {
            line-height: 8px;
        }
    </style>
</head>
<body class="boddy">
    <div  data-name="perfil" class="page">
        <div class="profile-container">
            <div class="profile-header">
                <img class="profile-picture" src="../imagens/Ryo-Yamada.jpeg" alt="Foto de perfil">
                <div class="profile-info">
                    <h2>J. Marcos Moura</h2>
                    <p>marcos_am</p>
                </div>
            </div>
        
            <div class="content">
                <div class="informations">
                    <p class="function" style="font-size: 16px;"><strong>Estudante - IFPI</strong></p>
                    <p class="membro" style="font-size: 11px; color: #969696;"><strong>Membro desde:</strong></p>
                    <p style="font-size: 12px">30 de abr. de 2023</p>
                </div>
        
                <div class="note" style="font-size: 14px;">
                    <p style="font-size: 11px; color: #969696;"><strong>Nota: </strong></p>
                    <p style="font-size: 12px">You`ll Never Walk Alone</p>
                </div>
        
                <div class="connections">
                    <div class="connection">
                        JMarcosMoura
                        <span>GitHub</span>
                    </div>
                    <div class="connection">
                        João Marcos
                        <span>Spotify</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
