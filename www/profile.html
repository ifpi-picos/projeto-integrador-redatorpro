<!DOCTYPE html>
<html>

<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Your app title -->
    <title>Meu Perfil</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- CSS PERSONALIZADO PARA PERFIL-->
    <link rel="stylesheet" href="iacorretor.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons@3.0/framework7-icons.css">
</head>

<body>
    <!-- App root element -->
    <div id="app">

        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <!-- Initial Page, "data-name" contains page name -->
            <div data-name="profile" class="page">

                <!-- Top Navbar -->
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner justify-content-center">
                        <div class="title title-rounded">Meu Perfil</div>
                    </div>
                </div>

                <!-- Scrollable page content -->
                <div class="page-content">
                    <div class="profile-container-mobile"> 
                        <!-- Área de cabeçalho com fundo gradiente -->
                        <div class="profile-header-mobile" aria-label="Cabeçalho do perfil">
                            <!-- Botão de editar -->
                            <a href="#" class="edit-profile-btn" id="editProfileBtn" aria-label="Editar perfil">
                                <i class="ri-pencil-fill"></i>
                            </a>
                            <!-- Avatar do usuário -->
                            <div class="profile-avatar" id="profileAvatar" style="position:relative;" aria-label="Foto do perfil">
                                <img src="img/default.png" alt="Foto do usuário" id="profileImg">
                                <input type="file" id="fotoPerfilInput" style="display:none" accept="image/*">
                                <!-- Ícone de câmera, inicialmente oculto -->
                                <span id="cameraIcon" style="display:none; position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.6); border-radius:50%; padding:7px; cursor:pointer;" aria-label="Alterar foto do perfil">
                                    <i style="color:white; font-size:20px;">
                                        <span class="material-symbols-outlined">photo_camera</span>
                                    </i>
                                </span>
                            </div>
                            <!-- Conteúdo do header -->
                            <div class="profile-header-content">
                                <!-- Nome do usuário -->
                                <h1 class="profile-name" id="profileName" aria-label="Nome do usuário">Carregando...</h1>
                                <!-- Tipo de usuário -->
                                <div class="profile-type" id="profileTipo" aria-label="Tipo de usuário"></div>
                                <!-- Instagram editável -->
                                <div style="margin:10px 0;">
                                    <span id="instagramSpan" aria-label="Instagram"></span>
                                    <input type="text" id="instagramInput" style="display:none" placeholder="Seu Instagram" aria-label="Instagram">
                                </div>
                                <!-- E-mail do usuário -->
                                <div class="profile-status" aria-label="E-mail do usuário">
                                    <span class="material-symbols-outlined">email</span>
                                    <span id="profileEmail" aria-label="E-mail do usuário">carregando...</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Botões de ação -->
                        <div class="profile-actions">
                            <!-- Botão para rede social (Instagram) -->
                            <a href="#" class="profile-action-btn social-btn disabled external">
                                <i class="ri-instagram-line"></i>
                            </a>
                            
                            <!-- Botão para redações -->
                            <a href="/redacoes/" class="profile-action-btn essays-btn">
                                <i class="ri-folder-user-fill"></i>
                            </a>
                        </div>
                        
                        <!-- Estatísticas do perfil -->
                        <div class="profile-stats">
                            <div class="stat-item">
                                <div class="stat-value" id="totalRedacoes">0</div>
                                <div class="stat-label">Redações</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="ultimaNota">-</div>
                                <div class="stat-label">Última Nota</div>
                            </div>
                        </div>

                        <!-- Grid para as seções no desktop -->
                        <div class="profile-grid">
                            <!-- Seção Sobre Mim -->
                            <div>
                                <h2 class="profile-section-title">Sobre Mim</h2>
                                <div class="profile-card">
                                    <p id="descricaoPerfil" style="max-height:8px;" aria-label="Descrição do perfil">Clique no lápis para editar</p>
                                    <textarea id="descricaoInput" style="display:none;width:100%;min-height:60px;" aria-label="Descrição"></textarea>
                                </div>
                            </div>

                            <!-- Seção Áreas de Interesse -->
                            <div>
                                <h2 class="profile-section-title">Áreas de Interesse</h2>
                                <div class="profile-card">
                                    <div class="interests" aria-label="Áreas de interesse">
                                        <!-- Tags dinâmicas serão inseridas via JS -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <!-- jQuery -->
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>	
    <!-- Roteamento do app-->
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="cordova.js"></script>
</body>

</html>
