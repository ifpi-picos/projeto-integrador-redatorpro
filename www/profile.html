<!DOCTYPE html>
<html>

<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Your app title -->
    <title>Meu Perfil</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!-- CSS PERSONALIZADO PARA PERFIL-->
    <link rel="stylesheet" href="css/profile.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons@3.0/framework7-icons.css">
</head>

<body>
    <!-- App root element -->
    <div id="app">

        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <!-- Initial Page, "data-name" contains page name -->
            <div data-name="profile" class="page">

                <!-- Top Navbar -->
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner justify-content-center">
                        <div class="title title-rounded">Meu Perfil</div>
                    </div>
                </div>

                <!-- Scrollable page content -->
                <div class="page-content">
                    <div class="profile-container-mobile"> 
                        <!-- Área de cabeçalho com fundo gradiente -->
                        <div class="profile-header-mobile">
                            <!-- Botão de editar -->
                            <a href="#" class="edit-profile-btn" id="editProfileBtn">
                                <i class="ri-pencil-fill"></i>
                            </a>
                            <!-- Avatar do usuário -->
                            <div class="profile-avatar" id="profileAvatar">
                                <img src="img/ellen.png" alt="Foto do usuário" id="profileImg">
                                <input type="file" id="fotoPerfilInput" style="display:none" accept="image/*">
                            </div>
                            <!-- Nome do usuário -->
                            <h1 class="profile-name" id="profileName">Carregando...</h1>
                            <!-- Tipo de usuário -->
                            <div class="profile-type" id="profileTipo"></div>
                            <!-- Nome do usuário do app (substitui Instagram) -->
                            <div style="margin:10px 0;">
                                <span id="instagramSpan"></span>
                            </div>
                            <!-- Descrição/recado -->
                            <div class="profile-status">
                                <i class="f7-icons"></i>
                                <span id="profileStatus">Bem-vindo!</span>
                            </div>
                        </div>
                        
                        <!-- Botões de ação -->
                        <div class="profile-actions">
                            <!-- Botão para rede social (Instagram) -->
                            <a href="#" class="profile-action-btn social-btn" style="display:none;">
                                <i class="ri-instagram-line"></i>
                            </a>
                            
                            <!-- Botão para redações -->
                            <a href="/redacoes/" class="profile-action-btn essays-btn">
                                <i class="ri-folder-user-fill"></i>
                            </a>
                        </div>
                        
                        <!-- Estatísticas do perfil -->
                        <div class="profile-stats">
                            <div class="stat-item">
                                <div class="stat-value" id="totalRedacoes">0</div>
                                <div class="stat-label">Redações</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="ultimaNota">-</div>
                                <div class="stat-label">Última Nota</div>
                            </div>
                        </div>

                        <!-- Seção Sobre Mim -->
                        <h2 class="profile-section-title">Sobre Mim</h2>
                        <div class="profile-card">
                            <p id="descricaoPerfil" style="min-height:40px;">Clique no lápis para editar sua descrição.</p>
                            <textarea id="descricaoInput" style="display:none;width:100%;min-height:60px;"></textarea>
                        </div>

                        <!-- Seção Áreas de Interesse -->
                        <h2 class="profile-section-title">Áreas de Interesse</h2>
                        <div class="profile-card">
                            <div class="interests">
                                <span class="interest">Redação ENEM</span>
                                <span class="interest">Gramática</span>
                                <span class="interest">BTS</span>
                                <span class="interest">Produção Textual</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <!-- jQuery -->
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>	
    <!-- Roteamento do app-->
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="cordova.js"></script>
</body>

</html>
