<!DOCTYPE html>
<html lang="pt">
<head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
    <link rel="stylesheet" href="css/repertorios.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertorios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="js/repertorios.js" defer></script> <!-- Inclui o arquivo JavaScript -->
</head>

<body class="body-repertorios">
    <div id="app">
        <div class="view view-main">
            <div data-name="repertorios" class="page">

                <div class="button-top">
                    <a href="/index/"><i class="ri-arrow-left-s-line"></i></a>
                </div>

                <header>
                    <h1>Repertórios</h1>
                </header>

                <h2 class="h2-repertorios">Escolha um tipo de repertório:</h2>

                <div class="repertorios-container">
                    <div class="repertorio-box filmes-series">
                        <div class="repertorio-content">
                            <img src="img/rep-filmes.png" alt="Filmes e Séries">
                            <h3>Filmes e Séries</h3>
                        </div>
                    </div>
                    <div class="repertorio-box livros">
                        <div class="repertorio-content">
                            <img src="img/rep-livros.png" alt="Livros">
                            <h3>Livros</h3>
                        </div>
                    </div>
                    <div class="repertorio-box fatos-historicos">
                        <div class="repertorio-content">
                            <img src="img/rep-historia.png" alt="Fatos Históricos">
                            <h3>Fatos Históricos</h3>
                        </div>
                    </div>
                    <div class="repertorio-box citacoes-outros">
                        <div class="repertorio-content">
                            <img src="img/rep-citacoes.png" alt="Citações e Outros">
                            <h3>Citações e Outros</h3>
                        </div>
                    </div>
                </div>

                <!-- Path to Framework7 Library Bundle JS-->
                <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
                <!-- jQuery -->
                <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
                <!-- Roteamento do app-->
                <script type="text/javascript" src="js/routes.js"></script>
                <script src="cordova.js"></script>

            </div>
        </div>
    </div>
    
</body>
</html>
