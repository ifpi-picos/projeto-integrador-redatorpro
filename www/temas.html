<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temas de Redação</title>
    <link rel="stylesheet" href="lib/framework7-bundle.min.css">
    <link rel="stylesheet" href="css/temas.css">
</head>
<body>
    <div id="app">
        <div class="view view-main">
            <div data-name="temas" class="page">
                
                <!-- Título topo -->
                <div class="top-nav">
                    <h1 class="title-logo"><span class="pro">Temas</span></h1>
                </div>

                <!--filtro e barra de pesquisa-->
                <form onsubmit="return false;">
                    <input id="inputBusca" onkeyup="filtrar()" placeholder="O que você procura?" type="text" class="search">
                    <i class="icone-busca ri-search-2-line"></i>
                </form>

                <div class="filter-button">
                    <button onclick="filtrarTema('')" class="geral">Geral</button>
                    <button onclick="filtrarTema('Enem')">Enem</button>
                    <button onclick="filtrarTema('Vestibular')">Vestibular</button>
                    <button onclick="filtrarTema('Ita')">Concursos</button>
                </div>
                <div class="page-content">
                    <!-- Filtro de temas
                    <div class="filter-button" style="text-align:center; margin-bottom:0px;">
                        <button onclick="filtrarTema('')" class="geral">Geral</button>
                        <button onclick="filtrarTema('ENEM')">ENEM</button>
                        <button onclick="filtrarTema('Vestibular')">VESTIBULAR</button>
                        <button onclick="filtrarTema('Concursos')">CONCURSOS</button>
                    </div>
                    -->

                    <div class="container" id="temas-container">
                        <!-- Os cards de temas serão inseridos dinamicamente aqui -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <script type="text/javascript" src="js/routes.js"></script>
</body>
</html>
